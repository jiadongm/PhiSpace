name: Build and publish vignettes

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vignette-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      OPENBLAS_NUM_THREADS: 2
      OMP_NUM_THREADS: 2
      PHISPACE_SITE_DIR: Test/site-vignettes
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: '4.5.0'
          use-public-rspm: true
      - uses: r-lib/actions/setup-pandoc@v2
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: pkg
          extra-packages: |
            url::https://cran.r-project.org/src/contrib/Archive/pkgdown/pkgdown_2.2.0.tar.gz
            any::pkgload
            any::rmarkdown
            any::knitr
            any::digest
            any::qs2
            any::tidyr
            any::ks
            any::clue
            any::stringr
            any::RColorBrewer
            any::zeallot
            any::plotly
            any::seriation
            any::ggdendro
      - name: Cache verified Stereo-seq inputs
        uses: actions/cache@v4
        with:
          path: Test/stereoseq-inputs
          key: stereoseq-inputs-${{ hashFiles('scripts/stereoseq-inputs.tsv') }}
      - name: Cache verified Visium inputs
        uses: actions/cache@v4
        with:
          path: Test/visium-inputs
          key: visium-inputs-${{ hashFiles('scripts/visium-inputs.tsv') }}
      - name: Cache verified BridgeAnnotation inputs and results
        uses: actions/cache@v4
        with:
          path: Test/bridge-annotation-inputs
          key: bridge-annotation-inputs-${{ hashFiles('scripts/bridge-annotation-inputs.tsv') }}
      - name: Cache verified Getting Started inputs
        uses: actions/cache@v4
        with:
          path: Test/getting-started-inputs
          key: getting-started-inputs-${{ hashFiles('scripts/getting-started-inputs.tsv') }}
      - name: Cache verified CITE-seq inputs and results
        uses: actions/cache@v4
        with:
          path: Test/cite-seq-inputs
          key: cite-seq-inputs-${{ hashFiles('scripts/cite-seq-inputs.tsv') }}
      - name: Cache verified PerturbSeq inputs
        uses: actions/cache@v4
        with:
          path: Test/perturbseq-inputs
          key: perturbseq-inputs-${{ hashFiles('scripts/perturbseq-inputs.tsv') }}
      - name: Build Stereo-seq with fresh results
        run: Rscript --vanilla scripts/build-stereoseq.R
      - name: Build Visium with fresh results
        run: Rscript --vanilla scripts/build-visium.R
      - name: Build BridgeAnnotation from verified cached results
        run: Rscript --vanilla scripts/build-bridge-annotation.R
      - name: Build Getting Started with fresh results
        run: Rscript --vanilla scripts/build-getting-started.R
      - name: Build CITE-seq from verified cached results
        run: Rscript --vanilla scripts/build-cite-seq.R
      - name: Build PerturbSeq with fresh results
        run: Rscript --vanilla scripts/build-perturbseq.R
      - name: Upload website for review
        uses: actions/upload-artifact@v4
        with:
          name: vignette-website
          path: Test/site-vignettes
          retention-days: 7
      - name: Upload Pages artifact
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: Test/site-vignettes

  deploy:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v4
