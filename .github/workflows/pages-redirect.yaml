name: Publish website redirects

# The website moved to https://mao-lab-org.github.io/PhiSpace/ on 2026-10-12.
# This workflow publishes the redirect pages in redirects/, which
# scripts/build-redirects.R wrote from the old sitemap.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: pages-redirect
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: redirects

  deploy:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
